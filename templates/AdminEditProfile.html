<!DOCTYPE html>
<html>

<head>
    <meta charset='utf-8'>
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">

</head>

<body>
    <nav class="navbar navbar-expand-lg" style="background-color: #71aded;">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Admin</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" href="/Admin/Home">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/Admin/Users">Users</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/Admin/Search">Search</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/Admin/Summary">Summary</a>
                    </li>
                </ul>
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="/Admin/EditProfile">Edit Profile</a>
                    </li>
                    <li class="nav-item">
                        <a class="btn btn-outline-danger ms-2" href="/User/login">Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container">
        <div class="position-relative mx-auto" style="max-width: 600px;">


            <a href="{{ url_for('Admin_home') }}" class="btn-close position-absolute"
                style="top: 0.5rem; right: 0.5rem;" aria-label="Close"></a>

            <h1 class="text-center mt-5 mb-4">Edit Profile</h1>
            <form class="row g-3 mx-auto" action="/Admin/EditProfile" method="POST" id="admineditprofile"
                style="max-width: 600px;">

                <div class="col-md-12">
                    <label for="inputEmail4" class="form-label">Email</label>
                    <input type="email" class="form-control" id="inputEmail4" name="email_id"
                        value="{{admin.admin_emailid}}" required>
                    {% with messages = get_flashed_messages(category_filter=["email_error"]) %}
                    {% if messages %}
                    <div class="text-danger small">{{ messages[0] }}</div>
                    {% endif %}
                    {% endwith %}
                </div>

                <div class="col-md-12">
                    <label for="inputUsername" class="form-label">Username</label>
                    <input type="text" class="form-control" id="inputAdminname" name="name" value="{{admin.admin_name}}"
                        required>
                </div>

                <div class="col-md-6">
                    <label for="inputPassword4" class="form-label">Password</label>
                    <input type="password" class="form-control" id="inputPassword4" name="password"
                        value="{{admin.admin_pw}}" required>
                </div>

                <div class="col-12">
                    <button type="submit" class="btn btn-primary w-100">Submit</button>
                </div>


            </form>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>

</body>

</html>
