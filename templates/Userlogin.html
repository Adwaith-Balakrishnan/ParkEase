<!DOCTYPE html>
<html>

<head>
	<meta charset='utf-8'>
	<title>User Login</title>
	<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">


</head>

<body class="login-page">
	<div class="container">
		<h1 class="text-center mt-5 mb-5">User Login</h1>
		{% with messages = get_flashed_messages(category_filter=["login_error"]) %}
		{% if messages %}
		<div class="alert alert-danger" role="alert">
			{{ messages[0] }}
		</div>
		{% endif %}
		{% endwith %}

		<form class="row g-3 mx-auto" action="/User/login" method="POST" id="userlogin" style="max-width: 600px;">
			<div>

				<label for="inputEmail4" class="form-label">Email</label>
				<input type="email" class="form-control" id="inputEmail4" name="email_id" required>
			</div>
			<div>
				<label for="inputPassword4" class="form-label">Password</label>
				<input type="password" class="form-control" id="inputPassword4" name="password" required>
			</div>
			<div class="col-12">
				<button type="submit" class="btn btn-primary w-100">Login</button>
			</div>
			<div>
				<a href="/User/registration">New user?</a>
			</div>
		</form>
	</div>
</body>

</html>
